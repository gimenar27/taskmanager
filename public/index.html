<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow</title>
<meta name="description" content="Tasks, bills and reminders, with notifications on your phone.">
<meta name="theme-color" content="#f4f8ee">
<link rel="manifest" href="/manifest-matcha.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-matcha.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-matcha.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Apply the saved color (matcha unless someone picked peach) before anything draws.
  try { document.documentElement.dataset.color = JSON.parse(localStorage.getItem('tf_color')) || 'matcha'; } catch (e) { document.documentElement.dataset.color = 'matcha'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ─── Welcome / sign in ─── -->
<div id="welcome" hidden>
  <div class="floating-words" id="floatingWords" aria-hidden="true"></div>
  <div class="wave-top" aria-hidden="true"></div>
  <div class="welcome-inner">
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-action="lang" data-lang="en">EN</button>
      <button type="button" data-action="lang" data-lang="es">ES</button>
    </div>
    <div class="hero">
      <img class="app-mark" src="/icons/icon-192-matcha.png" alt="">
      <div class="hero-badge" data-i18n="welcome.badge"></div>
      <h1><span data-i18n="welcome.title1"></span><br><span class="accent" data-i18n="welcome.title2"></span></h1>
      <p data-i18n="welcome.lead"></p>
    </div>
    <ul class="perks">
      <li><span class="perk-icon">💳</span><span><strong data-i18n="welcome.perk1Title"></strong> <span data-i18n="welcome.perk1"></span></span></li>
      <li><span class="perk-icon">🔔</span><span><strong data-i18n="welcome.perk2Title"></strong> <span data-i18n="welcome.perk2"></span></span></li>
      <li><span class="perk-icon">🤝</span><span><strong data-i18n="welcome.perk3Title"></strong> <span data-i18n="welcome.perk3"></span></span></li>
    </ul>
    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" data-action="auth-mode" data-mode="signup" class="active" role="tab" data-i18n="auth.createAccount"></button>
        <button type="button" data-action="auth-mode" data-mode="login" role="tab" data-i18n="auth.logIn"></button>
      </div>
      <form id="authForm" novalidate>
        <div class="field" id="nameField">
          <label for="authName" data-i18n="auth.name"></label>
          <input class="input" id="authName" name="name" autocomplete="name" placeholder="Gimena">
        </div>
        <div class="field">
          <label for="authEmail" data-i18n="auth.email"></label>
          <input class="input" id="authEmail" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" data-i18n-placeholder="auth.emailPlaceholder">
        </div>
        <div class="field">
          <label for="authPassword" data-i18n="auth.password"></label>
          <input class="input" id="authPassword" name="password" type="password" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" id="authSubmit" type="submit"></button>
        <div id="authMsg" class="form-msg" hidden></div>
      </form>
    </div>
    <p class="welcome-footer" data-i18n="footer.credit"></p>
  </div>
</div>

<!-- ─── Main app ─── -->
<div id="app" hidden>
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"></main>
  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tabs.home"></span>
    </button>
    <button type="button" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
      <span data-i18n="tabs.calendar"></span>
    </button>
    <button type="button" class="tab-add" data-action="new" data-i18n-aria="tabs.new">
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button type="button" data-tab="shared">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.8"/><path d="M16 14.2a5.2 5.2 0 0 1 6 5.3"/></svg>
      <span data-i18n="tabs.shared"></span>
    </button>
    <button type="button" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span class="me-label" data-i18n="tabs.me"></span>
    </button>
  </nav>
</div>

<div id="sheet-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/js/i18n.js"></script>
<script src="/js/schedule.js"></script>
<script src="/js/assistant.js"></script>
<script src="/js/app/core.js"></script>
<script src="/js/app/views.js"></script>
<script src="/js/app/sheets.js"></script>
<script src="/js/app/main.js"></script>
</body>
</html>
